<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Sin esto, Safari en modo oscuro pinta negro el lienzo vacío antes del primer cuadro -->
    <meta name="color-scheme" content="light" />
    <style>
      /* Lo primero que se pinta es el color del sobre, antes de que llegue cualquier CSS o JS */
      html, body { margin: 0; background: #a56c4d; }
      #pantalla-inicial {
        position: fixed;
        inset: 0;
        background: #a56c4d url(/media/intro2.jpg) center / cover no-repeat;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      /* Mismo aviso que el sobre interactivo, para que el cambio a React no se note */
      #pantalla-inicial p {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
        margin: 0;
        text-align: center;
        color: #fff;
        font: 500 12px/1.5 Montserrat, system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
    </style>
    <title>Mariana &amp; Giovanni · 26 de diciembre de 2026</title>
    <meta name="description" content="Con la bendición de Dios y de nuestros padres, tenemos el honor de invitarte a nuestra boda." />

    <!-- Vista previa al compartir (WhatsApp, iMessage, Facebook…).
         WhatsApp lee esto desde sus servidores sin ejecutar JavaScript: las URLs deben ser absolutas y con https.
         La imagen debe ser horizontal (1200×630) y pesar menos de ~300 KB para que se muestre en iPhone y Android. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Boda Mariana &amp; Giovanni" />
    <meta property="og:locale" content="es_GT" />
    <meta property="og:title" content="Mariana &amp; Giovanni · ¡Nos casamos! 💍" />
    <meta property="og:description" content="Te invitamos a celebrar nuestra boda el 26 de diciembre de 2026 en Ciudad de Guatemala. Abre tu invitación 🤍" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-invitacion.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-invitacion.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mariana y Giovanni en la playa al atardecer: te invitamos a nuestra boda, 26 de diciembre de 2026" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mariana &amp; Giovanni · ¡Nos casamos! 💍" />
    <meta name="twitter:description" content="Te invitamos a celebrar nuestra boda el 26 de diciembre de 2026 en Ciudad de Guatemala." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-invitacion.jpg" />
    <!-- Color de la barra del navegador: igual al sobre del intro -->
    <meta name="theme-color" content="#a56c4d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>" />
    <!-- Primer cuadro del intro: se pide de inmediato para que no haya pantalla vacía -->
    <link rel="preload" as="image" href="/media/intro2.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el primer pintado: el sobre no las necesita y para la portada ya llegaron -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- El sobre estático mientras carga el JS. React lo reemplaza al montar el intro, que muestra la misma imagen. -->
      <div id="pantalla-inicial"><p>Toca para abrir</p></div>
    </div>
    <script>
      (function () {
        var sobre = document.getElementById("pantalla-inicial");
        // En el panel no se muestra el sobre
        if (location.pathname.indexOf("/panel-") === 0) return sobre.remove();
        // Con red lenta el invitado puede tocar el sobre antes de que cargue la página:
        // se recuerda el toque (el intro lo retoma al montar) y se avisa que ya se está abriendo
        sobre.addEventListener("click", function () {
          window.__sobreTocado = true;
          sobre.querySelector("p").textContent = "Abriendo tu invitación…";
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
